services:

  # ─────────────────────────────────────────────────
  # Laravel PHP-FPM Application
  # ─────────────────────────────────────────────────
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: angkor_app
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      # All other env vars come from .env.production on the server
    env_file:
      - ./backend/.env.production
    volumes:
      - storage_uploads:/var/www/backend/storage/app/public
      - storage_logs:/var/www/backend/storage/logs
    networks:
      - angkor_net
    depends_on:
      - redis
      - db

  # ─────────────────────────────────────────────────
  # Nginx — Backend API Server (port 8080 internally)
  # ─────────────────────────────────────────────────
  backend_nginx:
    image: nginx:1.27-alpine
    container_name: angkor_backend_nginx
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./backend/docker/nginx-backend.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/public:/var/www/backend/public:ro
      - storage_uploads:/var/www/backend/storage/app/public:ro
    networks:
      - angkor_net
    depends_on:
      - app

  # ─────────────────────────────────────────────────
  # React/Vite Frontend (builds & serves via Nginx)
  # ─────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Points to the backend Nginx — update with your domain/IP in production
        # Use a relative API path so the browser hits the same host serving the frontend.
        # This avoids `localhost` being used inside users' browsers.
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: angkor_frontend
    restart: unless-stopped
    networks:
      - angkor_net

  # ─────────────────────────────────────────────────
  # Edge Nginx — Public Gateway (port 80 / port 443)
  # Routes:  /api → backend_nginx  |  / → frontend
  # ─────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: angkor_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443" # Prepared for future SSL support
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Uncomment below once you mount Let's Encrypt certificates for SSL
      # - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - angkor_net
    depends_on:
      - frontend
      - backend_nginx

  # ─────────────────────────────────────────────────
  # Redis — Queue & Cache
  # ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: angkor_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - angkor_net

  # ─────────────────────────────────────────────────
  # Optional Self-Hosted PostgreSQL Database
  # (Uncomment this block to run the database inside Docker)
  # ─────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: angkor_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-angkor_db}
      POSTGRES_USER: ${DB_USERNAME:-angkor_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-SecurePassword123!}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - angkor_net
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-angkor_user} -d ${DB_DATABASE:-angkor_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

# ─────────────────────────────────────────────────
# Named Volumes
# ─────────────────────────────────────────────────
volumes:
  storage_uploads:
  storage_logs:
  redis_data:
  # Uncomment if using self-hosted db
  pg_data:

# ─────────────────────────────────────────────────
# Networks
# ─────────────────────────────────────────────────
networks:
  angkor_net:
    driver: bridge
