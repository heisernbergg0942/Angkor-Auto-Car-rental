services:

  # ─────────────────────────────────────────────────
  # Laravel PHP-FPM Application
  # ─────────────────────────────────────────────────
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: angkor_app
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      # All other env vars come from .env.production on the server
    env_file:
      - ./backend/.env.production
    volumes:
      - storage_uploads:/var/www/backend/storage/app/public
      - storage_logs:/var/www/backend/storage/logs
    networks:
      - angkor_net
    depends_on:
      - redis

  # ─────────────────────────────────────────────────
  # Nginx — Backend API Server (port 8080 internally)
  # ─────────────────────────────────────────────────
  backend_nginx:
    image: nginx:1.27-alpine
    container_name: angkor_backend_nginx
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./backend/docker/nginx-backend.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/public:/var/www/backend/public:ro
      - storage_uploads:/var/www/backend/storage/app/public:ro
    networks:
      - angkor_net
    depends_on:
      - app

  # ─────────────────────────────────────────────────
  # React/Vite Frontend (builds & serves via Nginx)
  # ─────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Points to the backend Nginx — update with your domain in production
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api}
    container_name: angkor_frontend
    restart: unless-stopped
    networks:
      - angkor_net

  # ─────────────────────────────────────────────────
  # Edge Nginx — Public Gateway (port 80)
  # Routes:  /api → backend_nginx  |  / → frontend
  # ─────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: angkor_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - angkor_net
    depends_on:
      - frontend
      - backend_nginx

  # ─────────────────────────────────────────────────
  # Redis — Queue & Cache
  # ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: angkor_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - angkor_net

# ─────────────────────────────────────────────────
# Named Volumes
# ─────────────────────────────────────────────────
volumes:
  storage_uploads:
  storage_logs:
  redis_data:

# ─────────────────────────────────────────────────
# Networks
# ─────────────────────────────────────────────────
networks:
  angkor_net:
    driver: bridge
