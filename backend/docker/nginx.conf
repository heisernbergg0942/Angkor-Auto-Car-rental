# ─────────────────────────────────────────────────────────────────────────────
# docker/nginx.conf
# Production Nginx — reverse proxy for both API and frontend
# ─────────────────────────────────────────────────────────────────────────────

# HTTP Server — serves traffic initially and handles Let's Encrypt challenges
server {
    listen 80;
    server_name www.angkorauto.work angkorauto.work;

    client_max_body_size 25M;

    # ── Let's Encrypt Webroot Challenge path ──────────────────────────────────
    # This path must be served over HTTP so certbot can validate challenges.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redirect HTTP to HTTPS when certificates are present
    location / {
        return 301 https://$host$request_uri;
    }

    # ── Laravel API ───────────────────────────────────────────────────────────
    location /api {
        proxy_pass         http://backend_nginx:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /sanctum {
        proxy_pass         http://backend_nginx:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Storage / uploaded files
    location /storage {
        proxy_pass         http://backend_nginx:8080;
        proxy_set_header   Host              $host;
    }

    # ── React Frontend ────────────────────────────────────────────────────────
    location / {
        proxy_pass         http://frontend:80;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl http2;
    server_name www.angkorauto.work angkorauto.work; # REPLACE with your actual domain (e.g., angkorauto.com)

    ssl_certificate /etc/letsencrypt/live/www.angkorauto.work/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.angkorauto.work/privkey.pem;

    # Hardened SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 25M;

    # Laravel API (proxied to backend nginx)
    location /api {
        proxy_pass         http://backend_nginx:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location /sanctum {
        proxy_pass         http://backend_nginx:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }

    location /storage {
        proxy_pass         http://backend_nginx:8080;
        proxy_set_header   Host              $host;
    }

    # React Frontend
    location / {
        proxy_pass         http://frontend:80;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }
}

