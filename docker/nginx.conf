# ─────────────────────────────────────────────────────────────────────────────
# docker/nginx.conf
# Production Nginx — reverse proxy for both API and frontend
# ─────────────────────────────────────────────────────────────────────────────

# HTTP Server — serves traffic initially and handles Let's Encrypt challenges
server {
    listen 80;
    server_name www.angkorauto.work angkorauto.work;

    client_max_body_size 25M;

    # ── Let's Encrypt Webroot Challenge path ──────────────────────────────────
    # This path must be served over HTTP so certbot can validate challenges.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redirect HTTP to HTTPS when certificates are present
    location / {
        return 301 https://$host$request_uri;
    }

    # ── Laravel API ───────────────────────────────────────────────────────────
    location /api {
        proxy_pass         http://backend_nginx:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /sanctum {
        proxy_pass         http://backend_nginx:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Storage / uploaded files
    location /storage {
        proxy_pass         http://backend_nginx:8080;
        proxy_set_header   Host              $host;
    }

    # ── React Frontend ────────────────────────────────────────────────────────
    location / {
        proxy_pass         http://frontend:80;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl http2;
    server_name www.angkorauto.work angkorauto.work;

ssl_certificate /etc/letsencrypt/live/angkorauto.work/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/angkorauto.work/privkey.pem;

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25M;

    # Redirect HTTP to HTTPS is not needed here.
    # Proxy API
    location /api {
        proxy_pass http://backend_nginx:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    location /sanctum {
        proxy_pass http://backend_nginx:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /storage {
        proxy_pass http://backend_nginx:8080;
        proxy_set_header Host $host;
    }
    # Frontend
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
