# ─────────────────────────────────────────────────────────────────────────────
# docker/nginx.conf
# Production Nginx Gateway — handles SSL (Certbot) and routes traffic
# ─────────────────────────────────────────────────────────────────────────────

# HTTP Server — handles Let's Encrypt challenges and redirects everything else to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name angkorauto.work www.angkorauto.work;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server — secure reverse proxy
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name angkorauto.work www.angkorauto.work;

    client_max_body_size 25M;

    # SSL Certificates (will be mounted from host/certbot)
    ssl_certificate /etc/letsencrypt/live/angkorauto.work/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/angkorauto.work/privkey.pem;

    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # ── Let's Encrypt Webroot Challenge path (also in SSL for safety) ──────────
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # ── Backend API & Sanctum ───────────────────────────────────────────────
    location /api {
        proxy_pass         http://backend_nginx:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /sanctum {
        proxy_pass         http://backend_nginx:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Laravel uploaded files ──────────────────────────────────────────────
    location /storage {
        proxy_pass         http://backend_nginx:8080;
        proxy_set_header   Host              $host;
    }

    # ── React Frontend ──────────────────────────────────────────────────────
    location / {
        proxy_pass         http://frontend:80;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
