# ─────────────────────────────────────────────────────────────────────────────
# docker/nginx.conf
# Production Nginx — reverse proxy for both API and frontend
# Used only when you want a single Nginx container to handle everything.
# In docker-compose, the frontend container has its own Nginx (port 80)
# and the backend has its own Nginx (port 8080). This is the edge proxy.
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name _;

    client_max_body_size 25M;

    # ── Laravel API ───────────────────────────────────────────────────────────
    location /api {
        proxy_pass         http://backend_nginx:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /sanctum {
        proxy_pass         http://backend_nginx:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # Storage / uploaded files
    location /storage {
        proxy_pass         http://backend_nginx:8080;
        proxy_set_header   Host              $host;
    }

    # ── React Frontend ────────────────────────────────────────────────────────
    location / {
        proxy_pass         http://frontend:80;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }
}
