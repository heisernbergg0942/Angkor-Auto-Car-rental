# ─────────────────────────────────────────────────────────────────────────────
# docker/nginx.conf
# Production Nginx — reverse proxy for both API and frontend
# ─────────────────────────────────────────────────────────────────────────────

# HTTP Server — serves traffic initially and handles Let's Encrypt challenges
server {
    listen 80;
    server_name angkorauto.work www.angkorauto.work;

    client_max_body_size 25M;

    # ── Let's Encrypt Webroot Challenge path ──────────────────────────────────
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # ── Laravel API proxied to backend_nginx (which forwards to PHP‑FPM) ────────
    location /api {
        proxy_pass         http://backend_nginx:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /sanctum {
        proxy_pass         http://backend_nginx:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Storage / uploaded files
    location /storage {
        proxy_pass         http://backend_nginx:8080;
        proxy_set_header   Host              $host;
    }

    # Return 404 for any other paths – frontend is served elsewhere or disabled for now
    location / {
        return 404;
    }
}
