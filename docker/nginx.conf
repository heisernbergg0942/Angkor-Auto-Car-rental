# ─────────────────────────────────────────────────────────────────────────────
# docker/nginx.conf
# Production Nginx — reverse proxy for both API and frontend
# ─────────────────────────────────────────────────────────────────────────────

# HTTP Server — serves traffic initially and handles Let's Encrypt challenges
server {
    listen 80;
    server_name _; # Replace with your domain once pointed (e.g., angkorauto.com)

    client_max_body_size 25M;

    # ── Let's Encrypt Webroot Challenge path ──────────────────────────────────
    # Uncomment when ready to run Let's Encrypt ACME verification
    # location /.well-known/acme-challenge/ {
    #     root /var/www/certbot;
    # }

    # ── Redirect HTTP to HTTPS (Uncomment once SSL certificates are generated) ──
    # location / {
    #     return 301 https://$host$request_uri;
    # }

    # ── Laravel API ───────────────────────────────────────────────────────────
    location /api {
        proxy_pass         http://backend_nginx:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /sanctum {
        proxy_pass         http://backend_nginx:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Storage / uploaded files
    location /storage {
        proxy_pass         http://backend_nginx:8080;
        proxy_set_header   Host              $host;
    }

    # ── React Frontend ────────────────────────────────────────────────────────
    location / {
        proxy_pass         http://frontend:80;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

