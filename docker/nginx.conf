
# ─────────────────────────────────────────────────────────────────────────────
# docker/nginx.conf
# Production Nginx Gateway — SSL termination + reverse proxy
# ─────────────────────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────────────────────
# HTTP → HTTPS Redirect + Certbot Challenge
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;

    server_name angkorauto.work www.angkorauto.work;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ─────────────────────────────────────────────────────────────────────────────
# HTTPS Server
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name angkorauto.work www.angkorauto.work;

    client_max_body_size 25M;
    server_tokens off;

    # SSL Certificates
    ssl_certificate     /etc/letsencrypt/live/angkorauto.work/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/angkorauto.work/privkey.pem;

    # Modern SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Proxy Settings
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # ─────────────────────────────────────────────────────────────────────────
    # Let's Encrypt Challenge
    # ─────────────────────────────────────────────────────────────────────────
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # ─────────────────────────────────────────────────────────────────────────
    # Laravel API
    # ─────────────────────────────────────────────────────────────────────────
    location /api {
        proxy_pass http://angkor_backend_nginx:8080;
    }

    # ─────────────────────────────────────────────────────────────────────────
    # Laravel Sanctum
    # ─────────────────────────────────────────────────────────────────────────
    location /sanctum {
        proxy_pass http://angkor_backend_nginx:8080;
    }

    location /sanctum/csrf-cookie {
        proxy_pass http://angkor_backend_nginx:8080;
    }

    # ─────────────────────────────────────────────────────────────────────────
    # Laravel Storage
    # ─────────────────────────────────────────────────────────────────────────
    location /storage {
        proxy_pass http://angkor_backend_nginx:8080;
    }

    # ─────────────────────────────────────────────────────────────────────────
    # React Frontend
    # ─────────────────────────────────────────────────────────────────────────
    location / {
        proxy_pass http://angkor_frontend:80;
    }
}
